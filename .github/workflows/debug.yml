name: debug-linux
on:
  push:
    branches: [debug-linux]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gdb xvfb \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel 4
      - run: |
          bin="$(find build/Sampleforge_artefacts -type f -name 'Artilody Sampleforge')"
          timeout 60 xvfb-run -a gdb -batch -ex run -ex "thread apply all bt 25" --args "$bin" || true
